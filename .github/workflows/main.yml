name: Build Lancelot Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential curl flex git libncurses-dev \
          libssl-dev libelf-dev make python3 unzip wget xz-utils cpio

    - name: Set Script Executable
      run: chmod +x lancelot.sh

    - name: Run Kernel Build Script
      run: ./lancelot.sh

    - name: Upload Kernel Zip Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Zip
        path: |
          AnyKernel3-master/*.zip
